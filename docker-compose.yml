version: "3.8"

services:
  backend:
    image: ghcr.io/ronaimate-agent/clipboard-share/backend:latest
    container_name: clipboard-share-backend
    restart: unless-stopped
    volumes:
      - clipboard-data:/data
    expose:
      - "3000"
    environment:
      - DB_PATH=/data/clipboard.db

  frontend:
    image: ghcr.io/ronaimate-agent/clipboard-share/frontend:latest
    container_name: clipboard-share-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  clipboard-data:
