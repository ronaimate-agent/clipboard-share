version: "3.8"

services:
  app:
    image: ghcr.io/ronaimate-agent/clipboard-share:latest
    container_name: clipboard-share
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - clipboard-data:/data
    environment:
      - DB_PATH=/data/clipboard.db
    networks:
      - proxy-net

volumes:
  clipboard-data:

networks:
  proxy-net:
    external: true
